<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hitster Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
header{
  text-align:center;padding:10px;
  background:linear-gradient(135deg,#1a0033,#0a0a2e);
}
header h1{
  font-size:1.1rem;letter-spacing:3px;
  background:linear-gradient(90deg,#ff6ec7,#7873f5,#4fc3f7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
#camera-area{flex:1;position:relative;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;display:block}
#guide{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:220px;height:220px;
  border:2px solid rgba(255,110,199,0.4);
  border-radius:16px;pointer-events:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
#guide.found{
  border-color:#4fc3f7;
  box-shadow:0 0 24px rgba(79,195,247,0.5);
}
#panel{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(10,10,10,0.96);
  padding:28px 20px;text-align:center;
  transform:translateY(100%);
  transition:transform 0.3s ease;
}
#panel.show{transform:translateY(0)}
#play{
  background:linear-gradient(135deg,#1DB954,#1ed760);
  color:#fff;border:none;border-radius:50px;
  padding:16px 44px;font-size:1.1rem;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;
}
#play:active{opacity:0.8}
#next{
  background:transparent;color:#888;
  border:1px solid #333;border-radius:50px;
  padding:10px 28px;font-size:0.85rem;
  cursor:pointer;margin-top:14px;
}
#next:active{color:#fff;border-color:#666}
#status{
  text-align:center;padding:8px;
  font-size:0.8rem;color:#666;
}
#error{
  flex:1;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
#error h2{color:#ff6ec7;font-size:1.1rem}
#error p{color:#999;line-height:1.8;margin-top:12px;font-size:0.9rem}
</style>
</head>
<body>

<header><h1>HITSTER SCANNER</h1></header>

<div id="camera-area">
  <video id="video" autoplay playsinline muted></video>
  <div id="guide"></div>
  <div id="panel">
    <button id="play">&#9654; Spotify で再生</button><br>
    <button id="next">次のカードをスキャン</button>
  </div>
</div>

<div id="error">
  <h2>カメラを起動できません</h2>
  <p>
    ブラウザの設定でカメラの使用を許可してください。<br><br>
    Chrome の場合：アドレスバー左のアイコン → カメラ → 許可
  </p>
</div>

<div id="status">起動中...</div>

<script>
const video = document.getElementById('video');
const guide = document.getElementById('guide');
const panel = document.getElementById('panel');
const playBtn = document.getElementById('play');
const nextBtn = document.getElementById('next');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const cameraArea = document.getElementById('camera-area');

let stream = null;
let scanning = false;
let detectedUrl = null;
let animId = null;

// カメラ起動
async function openCamera() {
  // 既存ストリームを確実に解放
  closeCamera();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    cameraArea.style.display = '';
    errorEl.style.display = 'none';
    return true;
  } catch (e) {
    console.error('Camera error:', e);
    cameraArea.style.display = 'none';
    errorEl.style.display = 'flex';
    statusEl.textContent = 'カメラエラー';
    return false;
  }
}

// カメラ停止
function closeCamera() {
  scanning = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
}

// QRスキャンループ
async function startScan() {
  if (!('BarcodeDetector' in window)) {
    statusEl.textContent = 'このブラウザはQR読み取り非対応です。Chrome をお使いください。';
    return;
  }

  const detector = new BarcodeDetector({ formats: ['qr_code'] });
  scanning = true;
  statusEl.textContent = 'QRコードにカメラを向けてください';

  const loop = async () => {
    if (!scanning) return;
    try {
      const codes = await detector.detect(video);
      for (const c of codes) {
        if (c.rawValue && c.rawValue.includes('spotify.com')) {
          onFound(c.rawValue);
          return;
        }
      }
    } catch (_) {}
    animId = requestAnimationFrame(loop);
  };
  loop();
}

// QR検出時
function onFound(url) {
  scanning = false;
  detectedUrl = url;
  if (navigator.vibrate) navigator.vibrate(100);
  guide.classList.add('found');
  panel.classList.add('show');
  statusEl.textContent = 'QRコード検出！';
}

// 再生ボタン
playBtn.addEventListener('click', () => {
  if (detectedUrl) window.open(detectedUrl, '_blank');
});

// 次のカードボタン
nextBtn.addEventListener('click', () => {
  detectedUrl = null;
  guide.classList.remove('found');
  panel.classList.remove('show');
  startScan();
});

// ページ復帰時にカメラ再起動（黒画面対策の要）
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // バッテリー節約のため停止
    scanning = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
  } else {
    // 復帰時は常にカメラを再取得
    openCamera().then(ok => {
      if (ok && !detectedUrl) startScan();
    });
  }
});

// 初回起動
openCamera().then(ok => {
  if (ok) startScan();
});
</script>
</body>
</html>
